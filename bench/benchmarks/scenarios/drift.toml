# Scenario for synthetic stream drift replay.
# Evaluates 70 scored days (days 21 to 90, 2026-02-02 to 2026-05-08).
# Problems are 3 business days each, spaced >= 9 days after the previous problem of its category ends.
# At least 5 problems in each category: data_quality, drift, model_performance.

# --- Category: data_quality (5 problems) ---

[[injection]]
kind = "null_spike"
column = "salary"
share = 0.25
start = 2026-02-02
end = 2026-02-04

[[injection]]
kind = "out_of_range"
column = "age"
value = -10.0
share = 0.2
start = 2026-02-16
end = 2026-02-18

[[injection]]
kind = "null_spike"
column = "loan"
share = 0.25
start = 2026-03-02
end = 2026-03-04

[[injection]]
kind = "null_spike"
column = "hvalue"
share = 0.25
start = 2026-03-16
end = 2026-03-18

[[injection]]
kind = "out_of_range"
column = "loan"
value = -50000.0
share = 0.2
start = 2026-03-30
end = 2026-04-01

