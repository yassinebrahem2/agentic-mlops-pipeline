[project]
name = "benchmarks"
version = "0.1.0"
description = "Developer benchmarks for mlops-agents"
requires-python = ">=3.12"
dependencies = [
  "demo-world",
  "fastapi>=0.143.2",
  "httpx2>=2.13.1",
  "lightgbm>=4.7.0",
  "mlops-agents",
  "scikit-learn>=1.9.1",
]

[project.scripts]
bench = "benchmarks.cli:main"

[dependency-groups]
dev = [
  "pyright>=1.1.414",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-timeout>=2.4.0",
  "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/benchmarks"]

[tool.uv.sources]
mlops-agents = { path = "../../backend", editable = true }
demo-world = { path = "../demo-world", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PTH"]
# E501: ruff format enforces line length; long strings it cannot split are allowed.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106", "S107"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src", "../../backend/src", "../demo-world/src"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
timeout = 120
timeout_method = "thread"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
