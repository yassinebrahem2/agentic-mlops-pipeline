# The default scenario: one injected problem of each kind, spread over 2016, and the natural
# shift the evaluation scores. Dates are business dates (a bookings file's date is the day the
# bookings were made). The windows stay out of January 2016 (the legacy checks must be quiet
# there), away from the natural shift of November and December, and over 30 days apart, beyond
# the legacy checks' 7- and 30-day lookbacks, so each incident is scored on its own.
# `simulate --scenario scenarios/default.toml` plays it; without `--scenario` nothing is injected.

# Missing values in a share of each day's rows, as from a broken upstream join.
[[injection]]
kind = "null_spike"
columns = ["country", "adr"]
share = 0.3
start = 2016-02-15
end = 2016-02-21

# An upstream rename: the bookings files carry `lead_days` instead of `lead_time`.
[[injection]]
kind = "schema_break"
column = "lead_time"
rename_to = "lead_days"
start = 2016-04-04
end = 2016-04-06

# Rates delivered in cents instead of euros.
[[injection]]
kind = "out_of_range"
column = "adr"
factor = 100.0
start = 2016-05-16
end = 2016-05-22

# The bookings file arrives after the daily job has run (task 3 withholds it).
[[injection]]
kind = "score_failure"
start = 2016-07-04
end = 2016-07-06

# CI's sample data source is unavailable (task 3 points it at a missing file).
[[injection]]
kind = "ci_failure"
start = 2016-08-15
end = 2016-08-21

# Not injected: the source's own non-refundable group bookings, about 15% of the bookings made
# in November and December 2016 against about 1% in October. Only shifts with a clear start are
# scored; the gradual rise in online travel agent share is not.
[[natural_shift]]
columns = ["deposit_type", "market_segment"]
start = 2016-11-01
end = 2016-12-31
