[project]
name = "demo-world"
version = "0.1.0"
description = "The world around the demo company: source data, history, the day loop (developer tool)"
requires-python = ">=3.12"
dependencies = [
  "pandas>=3.1.0",
  "pyarrow>=26.0.0",
]

[project.scripts]
demo-world = "demo_world.cli:main"

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-timeout>=2.4.0",
  "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demo_world"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PTH"]
# E501: ruff format enforces line length; long strings it cannot split are allowed.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104"]

[tool.pytest.ini_options]
timeout = 120
timeout_method = "thread"
testpaths = ["tests"]
