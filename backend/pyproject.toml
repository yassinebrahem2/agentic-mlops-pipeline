[project]
name = "mlops-agents"
version = "0.1.0"
description = "Multi-agent system for autonomous MLOps pipelines"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.22.1",
  "cryptography>=46.0.7",
  "fastapi>=0.143.2",
  "httpx2>=2.13.1",
  "keyring>=25.7.0",
  "langchain-core>=1.6.11",
  "langchain-openai>=1.7.2",
  "langgraph>=1.2.15",
  "langgraph-checkpoint-sqlite>=3.1.2",
  "platformdirs>=4.9.6",
  "pydantic>=2.13.1",
  "python-ulid>=4.0.1",
  "pyyaml>=6.0.2",
  "sqlalchemy[asyncio]>=2.1.4",
  "sse-starlette>=3.3.4",
  "uvicorn>=0.44.0",
]

[project.scripts]
mlops-agents = "mlops_agents.cli:main"

[dependency-groups]
dev = [
  "pyright>=1.1.414",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "ruff>=0.17.1",
  "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlops_agents"]
# web/ is gitignored (generated by the frontend build), so it must be listed explicitly.
artifacts = ["src/mlops_agents/web/**"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PTH"]
# S603/S607: the app deliberately runs git, gh and rg as subprocesses without a shell.
# E501: ruff format enforces line length; long strings it cannot split are allowed.
ignore = ["E501", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live: calls a real external service (LLM provider or GitHub); run with -m live"]
addopts = "-m 'not live'"
