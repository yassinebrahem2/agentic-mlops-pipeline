# Moves cards on the project board for the statuses GitHub's built-in project workflows do not
# cover (they already handle Todo on add, and Done on close and merge).
name: board

on:
  issues:
    types: [assigned, unassigned, opened, closed]
  pull_request:
    types: [opened, reopened, ready_for_review]
    branches: [main]
  workflow_dispatch:
    inputs:
      number:
        description: Issue or PR number
        required: true
      status:
        description: Todo, In progress, Blocked, In review or Done
        required: true

concurrency:
  group: board-${{ github.event.issue.number || github.event.pull_request.number || inputs.number }}

permissions:
  contents: read

jobs:
  move:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts
      - name: Move cards
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          NUMBER: ${{ inputs.number }}
          STATUS: ${{ inputs.status }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Add a repository secret PROJECT_TOKEN (classic token with the project scope)."
            exit 1
          fi
          move() { scripts/board-status.sh "$1" "$2"; }
          has_label() { jq -e --arg l "$1" '.issue.labels | any(.name == $l)' "$GITHUB_EVENT_PATH" >/dev/null; }
          issue_number=$(jq -r '.issue.number // empty' "$GITHUB_EVENT_PATH")
          open=$(jq -r '.issue.state // empty' "$GITHUB_EVENT_PATH")

          case "$EVENT/$ACTION" in
            workflow_dispatch/*)
              move "$NUMBER" "$STATUS" ;;
            issues/assigned)
              # A task is claimed by assigning yourself (AGENTS.md).
              if has_label task && [ "$open" = open ]; then move "$issue_number" "In progress"; fi ;;
            issues/unassigned)
              left=$(jq '.issue.assignees | length' "$GITHUB_EVENT_PATH")
              if has_label task && [ "$open" = open ] && [ "$left" = 0 ]; then move "$issue_number" "Todo"; fi ;;
            issues/opened|issues/closed)
              # A Decision issue names the task it blocks under "Blocked task".
              if has_label decision; then
                task=$(jq -r '.issue.body // ""' "$GITHUB_EVENT_PATH" \
                  | awk '/^### Blocked task/{f=1; next} /^### /{f=0} f' \
                  | grep -oE '#[0-9]+' | head -n1 | tr -d '#' || true)
                if [ -n "$task" ]; then
                  if [ "$ACTION" = opened ]; then move "$task" "Blocked"; else move "$task" "In progress"; fi
                fi
              fi ;;
            pull_request/*)
              if [ "$(jq -r '.pull_request.draft' "$GITHUB_EVENT_PATH")" = false ]; then
                jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH" \
                  | grep -ioE '(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' \
                  | grep -oE '[0-9]+' | sort -u \
                  | while read -r n; do move "$n" "In review"; done
              fi ;;
          esac
