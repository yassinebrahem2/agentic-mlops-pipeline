# Adds new issues to the project board and moves cards for the statuses GitHub's built-in project
# workflows do not cover (they handle Done on close and merge). Adding is done here so it does not
# depend on the board's built-in auto-add workflow, which missed new issues on another project.
name: board

on:
  issues:
    types: [assigned, unassigned, opened, closed]
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    branches: [main]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      number:
        description: Issue or PR number
        required: true
      status:
        description: Todo, In progress, Blocked, In review or Done
        required: true

concurrency:
  group: board-${{ github.event.issue.number || github.event.pull_request.number || inputs.number }}

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  move:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts
      - name: Move cards
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          NUMBER: ${{ inputs.number }}
          STATUS: ${{ inputs.status }}
          REPO_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Add a repository secret PROJECT_TOKEN (classic token with the project scope)."
            exit 1
          fi
          move() { scripts/board-status.sh "$1" "$2"; }
          has_label() { jq -e --arg l "$1" '.issue.labels | any(.name == $l)' "$GITHUB_EVENT_PATH" >/dev/null; }
          # The issues a PR closes, from the "Closes #n" lines of its body.
          move_closed() {
            jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH" \
              | { grep -ioE '(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' || [ $? = 1 ]; } \
              | { grep -oE '[0-9]+' || [ $? = 1 ]; } | sort -u \
              | while read -r n; do
                  # A closed issue stays Done whatever happens to the PR that names it.
                  state=$(GH_TOKEN="$REPO_TOKEN" gh issue view "$n" --repo "$GITHUB_REPOSITORY" --json state --jq .state)
                  if [ "$state" = OPEN ]; then move "$n" "$1"; fi
                done
          }
          move_pr() { move "$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")" "$1"; move_closed "$1"; }
          issue_number=$(jq -r '.issue.number // empty' "$GITHUB_EVENT_PATH")
          open=$(jq -r '.issue.state // empty' "$GITHUB_EVENT_PATH")

          case "$EVENT/$ACTION" in
            workflow_dispatch/*)
              move "$NUMBER" "$STATUS" ;;
            issues/assigned)
              # A task is claimed by assigning yourself (AGENTS.md).
              if has_label task && [ "$open" = open ]; then move "$issue_number" "In progress"; fi ;;
            issues/unassigned)
              left=$(jq '.issue.assignees | length' "$GITHUB_EVENT_PATH")
              if has_label task && [ "$open" = open ] && [ "$left" = 0 ]; then move "$issue_number" "Todo"; fi ;;
            issues/opened|issues/closed)
              if [ "$ACTION" = opened ]; then move "$issue_number" "Todo"; fi
              # A Decision issue names the task it blocks under "Blocked task".
              if has_label decision; then
                task=$(jq -r '.issue.body // ""' "$GITHUB_EVENT_PATH" \
                  | awk '/^### Blocked task/{f=1; next} /^### /{f=0} f' \
                  | grep -oE '#[0-9]+' | head -n1 | tr -d '#' || true)
                if [ -n "$task" ]; then
                  if [ "$ACTION" = opened ]; then move "$task" "Blocked"; else move "$task" "In progress"; fi
                fi
              fi ;;
            pull_request/synchronize)
              # A push to a PR with changes requested hands it back to the lead; other pushes
              # (an Update branch, a draft's work in progress) leave the cards where they are.
              if [ "$(jq -r '.pull_request.draft' "$GITHUB_EVENT_PATH")" = false ]; then
                decision=$(GH_TOKEN="$REPO_TOKEN" gh pr view "$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")" \
                  --repo "$GITHUB_REPOSITORY" --json reviewDecision --jq '.reviewDecision')
                if [ "$decision" = CHANGES_REQUESTED ]; then move_pr "In review"; fi
              fi ;;
            pull_request/*)
              if [ "$(jq -r '.pull_request.draft' "$GITHUB_EVENT_PATH")" = false ]; then move_closed "In review"; fi ;;
            pull_request_review/submitted)
              # Changes requested: the PR waits on its owner, so it leaves In review until the next push.
              if [ "$(jq -r '.review.state' "$GITHUB_EVENT_PATH")" = changes_requested ]; then move_pr "In progress"; fi ;;
          esac
