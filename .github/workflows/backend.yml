name: Backend

# Push only: every PR comes from a plan/** branch of this repository, and the push run's checks
# show on the PR's head commit. A pull_request trigger as well would run CI twice per commit.
on:
  push:
    branches: ["main", "plan/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.6"

jobs:
  backend:
    name: backend (${{ matrix.name }})
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-latest
            os: ubuntu-latest
          # Windows splits the tests by folder over separate runners, each running its share in
          # one process: pytest-xdist gains little there. The split is in "Tests (Windows shard)".
          - name: windows-latest 1/3
            os: windows-latest
            shard: "1"
          - name: windows-latest 2/3
            os: windows-latest
            shard: "2"
          - name: windows-latest 3/3
            os: windows-latest
            shard: rest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - name: Install ripgrep (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install ripgrep (Windows)
        if: runner.os == 'Windows'
        run: choco install ripgrep -y
      - run: uv sync --locked
      # Lint, types and the API schema do not depend on the OS: Linux checks them, Windows only
      # runs the tests.
      - if: runner.os == 'Linux'
        run: uv lock --check
      - if: runner.os == 'Linux'
        run: uv run ruff check
      - if: runner.os == 'Linux'
        run: uv run ruff format --check
      - if: runner.os == 'Linux'
        run: uv run ruff check ../scripts
      - if: runner.os == 'Linux'
        run: uv run ruff format --check ../scripts
      - if: runner.os == 'Linux'
        run: uv run pyright
      - if: runner.os == 'Linux'
        run: uv run python -m mlops_agents.api.openapi_export --check
      # A -m here replaces the one in addopts, so both steps repeat "not live and not docker";
      # together they select exactly what a plain `uv run pytest` does. Tests marked serial are
      # sensitive to CPU load and run afterwards, alone.
      - name: Tests (parallel)
        id: parallel
        if: runner.os == 'Linux'
        shell: bash
        run: uv run pytest -n 4 -m "not live and not docker and not serial"
      - name: Tests (serial)
        # Also after a parallel failure, so one run reports every failing test.
        if: ${{ runner.os == 'Linux' && !cancelled() && steps.parallel.outcome != 'skipped' }}
        shell: bash
        run: uv run pytest -m "serial and not live and not docker"
      - name: Tests (Windows shard)
        if: runner.os == 'Windows'
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        # Each folder of tests/ named here runs in its shard, balanced by test time (about 260 s
        # each locally). The "rest" shard runs everything else, so a new test folder or file is
        # never left out.
        run: |
          declare -A folder_shard=(
            [agents/runtime]=1
            [agents/tasks]=1
            [events]=1
            [storage]=1
            [api]=2
            [agents/tools]=2
            [agents/messaging]=2
            [workspace]=2
          )
          args=()
          if [ "$SHARD" = rest ]; then
            args+=(tests)
            for folder in "${!folder_shard[@]}"; do args+=("--ignore=tests/$folder"); done
          else
            for folder in "${!folder_shard[@]}"; do
              if [ "${folder_shard[$folder]}" = "$SHARD" ]; then args+=("tests/$folder"); fi
            done
          fi
          uv run pytest "${args[@]}"

  docker:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest -m docker
