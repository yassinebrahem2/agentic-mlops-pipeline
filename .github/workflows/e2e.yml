name: E2E

on:
  push:
    branches: ["main", "plan/**"]
  pull_request:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.6"

jobs:
  e2e:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: uv sync --locked
        working-directory: backend
      - run: npm run e2e
      - name: Check the e2e data folder was removed
        run: |
          temp_dir="$(node -p "require('os').tmpdir()")"
          echo "OS temp folder: $temp_dir"
          left="$(find "$temp_dir" -mindepth 1 -maxdepth 1 -name 'mlops-agents-e2e-*')"
          if [ -n "$left" ]; then
            echo "e2e data folders left behind:"
            echo "$left"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
