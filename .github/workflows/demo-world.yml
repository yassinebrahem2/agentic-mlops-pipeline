name: Demo world

on:
  push:
    branches: ["main", "plan/**"]
    paths:
      - "bench/demo-world/**"
      - ".github/workflows/demo-world.yml"
  pull_request:
    paths:
      - "bench/demo-world/**"
      - ".github/workflows/demo-world.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  demo-world:
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: bench/demo-world
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest
