name: Demo world

on:
  push:
    branches: ["main", "plan/**"]
    paths:
      - "bench/demo-world/**"
      - ".github/workflows/demo-world.yml"
  pull_request:
    paths:
      - "bench/demo-world/**"
      - ".github/workflows/demo-world.yml"
  # Daily, so a change on the demo repository's main that breaks the contract shows within a day.
  schedule:
    - cron: "30 4 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  demo-world:
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: bench/demo-world
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest

  # The contract test: five days generated by the world from the committed fixture, with the
  # company's real `daily` run on each, from a checkout of the demo repository's main. Ubuntu
  # only: the job above already runs the world on Windows, and this one adds the company.
  contract:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      HOTEL_DEMO_COMPANY: ${{ github.workspace }}/company
    defaults:
      run:
        working-directory: bench/demo-world
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: yassinebrahem2/hotel-cancellation-demo
          ref: main
          path: company
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv sync --locked
        working-directory: company
      - run: uv run pytest tests/test_company_real.py -v -rs
