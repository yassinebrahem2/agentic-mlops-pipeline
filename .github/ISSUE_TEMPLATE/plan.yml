name: Implementation plan
description: Lead only. Assigns an implementation plan to the team.
title: "[Plan] "
labels: ["plan"]
body:
  - type: input
    id: plan
    attributes:
      label: Plan
      description: Path to the plan in docs/superpowers/plans/
    validations:
      required: true
  - type: input
    id: branch
    attributes:
      label: Branch
      description: The plan branch, plan/<stage>-<topic>
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Owner
      description: The one teammate who implements this plan's tasks (@login); also the issue's assignee
    validations:
      required: true
  - type: input
    id: reviewer
    attributes:
      label: Reviewer
      description: The teammate who reviews each task PR before the lead (@login)
    validations:
      required: true
  - type: input
    id: spec
    attributes:
      label: Spec
      description: Path to the spec in docs/superpowers/specs/
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: Summary
      description: Task sub-issues are created from the plan after this issue is opened. Summarize the plan here.
      value: |
        
    validations:
      required: true
