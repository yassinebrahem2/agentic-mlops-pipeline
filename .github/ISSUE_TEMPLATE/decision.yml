name: Decision
description: A real decision that needs the lead or the team. Not for bugs, chores or ideas.
title: "[Decision] "
labels: ["decision"]
body:
  - type: input
    id: context
    attributes:
      label: Plan issue or document
      description: Where this came up (plan issue number, spec or plan path)
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Decision needed
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options
      description: Each option with its trade-offs. Mark the one you recommend.
    validations:
      required: true
  - type: textarea
    id: blocking
    attributes:
      label: What is blocked until this is decided
    validations:
      required: true
